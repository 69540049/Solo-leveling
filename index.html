<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Level Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <section class="hero">
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="12"/><circle class="fill" id="ringFill" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
      <div class="lv"><small>เลเวล</small><b id="lvNum">1</b></div>
    </div>
    <div class="who">
      <h1><span id="name">นักสู้</span><button class="edit-name" id="editName" aria-label="แก้ชื่อ">แก้ชื่อ</button></h1>
      <span class="rank" id="rank">มือใหม่</span>
      <div class="xpline" id="xpLine">0 / 100 XP ถึงเลเวลถัดไป</div>
    </div>
  </section>

  <div class="stats">
    <div class="stat"><b id="sXp">0</b><span>XP สะสม</span></div>
    <div class="stat"><b id="sStreak">0</b><span>วันติดกัน 🔥</span></div>
    <div class="stat"><b id="sCount">0</b><span>ครั้งที่ออกกำลัง</span></div>
  </div>

  <!-- TODAY -->
  <main id="tab-today">
    <h2>ภารกิจวันนี้</h2>
    <p class="sub">ทำครบทุกข้อรับโบนัส +50 XP ภารกิจรีเซ็ตทุกเที่ยงคืน</p>
    <ul class="quests" id="quests"></ul>
    <p class="bonus" id="bonus"></p>

    <h2>บันทึกการออกกำลังกาย</h2>
    <div class="form">
      <div class="chips" id="chips" role="group" aria-label="ประเภทการออกกำลังกาย"></div>
      <div class="row">
        <label>จำนวน <span id="unit">(ครั้ง)</span>
          <input id="amount" type="number" inputmode="numeric" min="1" placeholder="เช่น 20">
        </label>
        <button class="btn" id="addBtn" disabled>บันทึก</button>
      </div>
      <div class="preview" id="preview">เลือกท่าแล้วกรอกจำนวนเพื่อดู XP ที่จะได้</div>
    </div>
  </main>

  <!-- HISTORY -->
  <main id="tab-history" hidden>
    <h2>XP 7 วันล่าสุด</h2>
    <div class="chart" id="chart"></div>
    <h2>ประวัติล่าสุด</h2>
    <ul class="log" id="log"></ul>
  </main>

  <!-- BADGES -->
  <main id="tab-badges" hidden>
    <h2>ความสำเร็จ</h2>
    <p class="sub" id="badgeCount"></p>
    <div class="badges" id="badges"></div>
    <div class="foot"><button class="btn ghost" id="resetBtn">เริ่มใหม่ทั้งหมด</button></div>
  </main>
</div>

<nav class="tabs" role="tablist">
  <button role="tab" aria-selected="true" data-tab="today"><span>⚡</span>วันนี้</button>
  <button role="tab" aria-selected="false" data-tab="history"><span>📈</span>ประวัติ</button>
  <button role="tab" aria-selected="false" data-tab="badges"><span>🏅</span>ความสำเร็จ</button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden></div>

<script src="app.js"></script>
</body>
</html>
